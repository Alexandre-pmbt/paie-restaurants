<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Paie Restaurants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : barre société/mois en haut, onglets, puis un plan de travail par onglet (tableaux denses, panneau de détail). */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#15232b; --muted:#5d6d76; --line:#d9e1e5; --soft:#e9eff1;
  --accent:#0b6e78; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --ok:#1d7a46; --ok-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbefd6; --bad:#b3261e; --bad-soft:#fbe1df;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#152127; --ink:#e3ecef; --muted:#93a5ad; --line:#26363e; --soft:#1b2a31;
  --accent:#4cc0c9; --accent-ink:#06262a; --accent-soft:#163a3f;
  --ok:#5cc98a; --ok-soft:#173527; --warn:#e2b04f; --warn-soft:#3a2f14; --bad:#f08a82; --bad-soft:#3d1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#152127; --ink:#e3ecef; --muted:#93a5ad; --line:#26363e; --soft:#1b2a31;
  --accent:#4cc0c9; --accent-ink:#06262a; --accent-soft:#163a3f;
  --ok:#5cc98a; --ok-soft:#173527; --warn:#e2b04f; --warn-soft:#3a2f14; --bad:#f08a82; --bad-soft:#3d1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.ctx{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{font-family:var(--f-num);text-align:right}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button.link{border:none;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:15px;font-weight:650}
.panel h3{margin:0;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--soft);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.sel td{background:var(--accent-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.total td{font-weight:700;background:var(--soft)}
td input{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--accent-soft);color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:7px 10px;font-size:12.5px}
.alerts li.bad{background:var(--bad-soft)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.form label.check{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--soft)}
.drop.over{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-num);font-size:17px}
.kpi span{font-size:12px;color:var(--muted)}
.slip{font-size:12px}
.slip .slip-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.slip .who{background:var(--soft);border-radius:6px;padding:8px 10px}
.slip td,.slip th{padding:4px 7px}
.slip tr.strong td{font-weight:700;background:var(--soft)}
.slip tr.nap td{font-weight:700;background:var(--accent-soft);font-size:13px}
.docprev{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 26px;max-height:78vh;overflow:auto;font-size:12.5px;line-height:1.5}
.docprev p{margin:0 0 6px;text-align:justify}
.docprev p.li{padding-left:18px}
.docprev h4{margin:12px 0 4px;font-size:12.5px;text-decoration:underline}
.docprev .doc-title{border:1.5px solid var(--ink);text-align:center;font-weight:700;padding:6px;margin-bottom:12px}
.docprev .sig{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0 40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:10;max-width:calc(100% - 32px)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.confirm{background:var(--warn-soft);border-radius:6px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}

/* Reset de base */
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
.userbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.login{display:flex;justify-content:center;padding-block:6vh}
.login .panel{width:100%;max-width:420px}
.form.one{grid-template-columns:minmax(0,1fr)}
code{font-family:var(--f-num)}
input[type=file]{max-width:100%;border:none;background:none;padding:0}
.docprev .doc-tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12.5px}
.docprev .doc-tbl td{border:1px solid var(--line,#ccd);padding:4px 8px}
.docprev .doc-tbl td.num{text-align:right;white-space:nowrap}
.docprev .doc-tbl tr.b td{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Paie Restaurants</h1></div>
    <div class="ctx" id="ctx" hidden>
      <label class="small muted" for="selSoc">Société</label>
      <select id="selSoc"></select>
      <label class="small muted" for="selMois">Mois</label>
      <input id="selMois" type="month">
    </div>
    <div class="userbox" id="userbox" hidden><span id="who"></span><button class="link" id="monMdp" type="button">Mon mot de passe</button><button class="link" id="logout" type="button">Se déconnecter</button></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs" hidden></nav>
  <main id="view"><div class="empty">Chargement…</div></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supa-db.js"></script>
<script src="core.js"></script>
<script src="contrats.js"></script>
<script src="docx.js"></script>
<script src="cafat.js"></script>
<script src="app.js"></script>
</body>
</html>
